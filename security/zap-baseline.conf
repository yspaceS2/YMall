# OWASP ZAP baseline rule policy.
# Medium-risk findings fail the manual DAST workflow. Low-risk hardening
# findings remain visible as warnings. Informational SPA/cache findings are
# ignored because they do not represent vulnerabilities by themselves.
10038	FAIL	(Content Security Policy Header Not Set)
10055	FAIL	(CSP wildcard or overly broad directive)
10063	WARN	(Permissions Policy Header Not Set)
90004	WARN	(Cross-origin login compatibility; review by 2026-11-09)
10027	IGNORE	(Information Disclosure - Suspicious Comments)
10049	IGNORE	(Storable and Cacheable Content)
10109	IGNORE	(Modern Web Application)
