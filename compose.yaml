name: ymall

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ymall}
      POSTGRES_USER: ${POSTGRES_USER:-ymall_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ymall_local_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ymall-network

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ymall-network

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ymall-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ymall}
      DB_USERNAME: ${POSTGRES_USER:-ymall_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ymall_local_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: ymall-compose
      JWT_SECRET: ${JWT_SECRET:-ymall-local-compose-jwt-secret-change-before-production-2026}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      OAUTH2_FRONTEND_REDIRECT_URI: http://localhost:${FRONTEND_PORT:-5173}/oauth2/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-disabled}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-local-disabled}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-local-disabled}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-local-disabled}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-local-disabled}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TOSS_API_BASE_URL: ${TOSS_API_BASE_URL:-https://api.tosspayments.com}
      MAIL_HOST: ${MAIL_HOST:-host.docker.internal}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-local-disabled}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-local-disabled}
      MAIL_FROM: ${MAIL_FROM:-noreply@ymall.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED:-false}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ymall-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_OAUTH2_BASE_URL: ""
        VITE_TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ymall-network

  ai-contract-check:
    image: python:3.12-alpine
    profiles:
      - ai-check
    working_dir: /workspace
    command: ["python", "-m", "ai.inference.check_service"]
    environment:
      AI_REVIEW_MAX_TOKENS: ${AI_REVIEW_MAX_TOKENS:-192}
      AI_REVIEW_REQUEST_TIMEOUT_SECONDS: ${AI_REVIEW_REQUEST_TIMEOUT_SECONDS:-180}
    volumes:
      - ./ai/inference:/workspace/ai/inference:ro
    models:
      review-summary-model:
        endpoint_var: AI_REVIEW_MODEL_URL
        model_var: AI_REVIEW_MODEL_NAME
    networks:
      - ymall-network

models:
  review-summary-model:
    model: ${AI_REVIEW_MODEL:-hf.co/Qwen/Qwen3-0.6B-GGUF:Q8_0}
    runtime_flags:
      - "--ctx-size"
      - "${AI_REVIEW_CONTEXT_SIZE:-4096}"
      - "--threads"
      - "${AI_REVIEW_THREADS:-4}"
      - "--parallel"
      - "${AI_REVIEW_PARALLEL:-1}"
      - "--n-gpu-layers"
      - "${AI_REVIEW_GPU_LAYERS:-0}"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  backend-uploads:

networks:
  ymall-network:
    driver: bridge
