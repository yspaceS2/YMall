spring:
  datasource:
    url: jdbc:h2:mem:ymall-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  mail:
    host: localhost

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid, profile, email

ymall:
  jwt:
    secret: test-jwt-secret-key-for-ymall-that-is-at-least-32-bytes-long
    access-token-expiration: 30m
    refresh-token-expiration: 14d
    refresh-token-cookie-secure: false
  file:
    upload-dir: ./build/test-uploads
    image-url-prefix: /images
    thumbnail-width: 300
    thumbnail-height: 300
  mail:
    from: test@ymall.local
  cache:
    product-detail-ttl: 10m
    review-summary-ttl: 30m
  ai:
    review-summary:
      enabled: false
      base-url: http://localhost:12434/engines/v1
      model: test-review-model
      minimum-reviews: 10
      maximum-reviews: 100
      maximum-review-length: 1000
      maximum-total-length: 6000
      maximum-tokens: 192
      connect-timeout: 100ms
      read-timeout: 100ms
      lock-ttl: 1m
  kafka:
    enabled: false
    order-events:
      name: ymall.order.events.v1
      partitions: 3
      replication-factor: 1
      retention: 7d
    outbox:
      enabled: false
      batch-size: 10
      max-attempts: 3
      retry-delay: 1ms
      send-timeout: 1s
      poll-interval: 1h
      cleanup-interval: 1h
      published-retention: 7d
    notification-consumer:
      enabled: false
      group-id: ymall-notification-test
    review-summary:
      name: ymall.review-summary.refresh.v1
      partitions: 1
      replication-factor: 1
      retention: 1d
      group-id: ymall-review-summary-test
    consumer-retry:
      max-retries: 2
      retry-delay: 10ms
      dlt-retention: 1d
