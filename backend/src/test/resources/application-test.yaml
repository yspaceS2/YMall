spring:
  datasource:
    url: jdbc:h2:mem:ymall-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  mail:
    host: localhost

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope: openid, profile, email

ymall:
  jwt:
    secret: test-jwt-secret-key-for-ymall-that-is-at-least-32-bytes-long
    access-token-expiration: 30m
  file:
    upload-dir: ./build/test-uploads
    image-url-prefix: /images
    thumbnail-width: 300
    thumbnail-height: 300
  mail:
    from: test@ymall.local
