server:
  port: 8080

spring:
  profiles:
    default: local

  application:
    name: backend

  jpa:
    properties:
      hibernate:
        format_sql: true

ymall:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
  file:
    upload-dir: ./uploads
    image-url-prefix: /images
    thumbnail-width: 300
    thumbnail-height: 300
