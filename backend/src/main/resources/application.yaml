server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  profiles:
    default: local

  application:
    name: backend

  jpa:
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ymall-local}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ymall.backend.global.messaging
        spring.json.value.default.type: com.ymall.backend.global.messaging.OrderEventEnvelope

ymall:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}
    refresh-token-cookie-secure: ${JWT_REFRESH_TOKEN_COOKIE_SECURE:false}
  file:
    upload-dir: ./uploads
    image-url-prefix: /images
    thumbnail-width: 300
    thumbnail-height: 300
  cache:
    product-detail-ttl: ${PRODUCT_DETAIL_CACHE_TTL:10m}
    review-summary-ttl: ${REVIEW_SUMMARY_CACHE_TTL:30m}
  ai:
    review-summary:
      enabled: ${AI_REVIEW_ENABLED:false}
      base-url: ${AI_REVIEW_BASE_URL:http://localhost:12434/engines/v1}
      model: ${AI_REVIEW_MODEL:huggingface.co/qwen/qwen3-0.6b-gguf:Q8_0}
      minimum-reviews: ${AI_REVIEW_MINIMUM_REVIEWS:10}
      maximum-reviews: ${AI_REVIEW_MAXIMUM_REVIEWS:100}
      maximum-review-length: ${AI_REVIEW_MAXIMUM_REVIEW_LENGTH:1000}
      maximum-total-length: ${AI_REVIEW_MAXIMUM_TOTAL_LENGTH:6000}
      maximum-tokens: ${AI_REVIEW_MAX_TOKENS:192}
      connect-timeout: ${AI_REVIEW_CONNECT_TIMEOUT:3s}
      read-timeout: ${AI_REVIEW_READ_TIMEOUT:180s}
      lock-ttl: ${AI_REVIEW_LOCK_TTL:5m}
  payment:
    toss:
      client-key: ${TOSS_CLIENT_KEY:}
      secret-key: ${TOSS_SECRET_KEY:}
      base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
      connect-timeout: ${TOSS_CONNECT_TIMEOUT:3s}
      read-timeout: ${TOSS_READ_TIMEOUT:5s}
  order:
    pending-expiration:
      enabled: ${PENDING_ORDER_EXPIRATION_ENABLED:true}
      timeout: ${PENDING_ORDER_EXPIRATION_TIMEOUT:30m}
      batch-size: ${PENDING_ORDER_EXPIRATION_BATCH_SIZE:100}
      poll-interval: ${PENDING_ORDER_EXPIRATION_POLL_INTERVAL:1m}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    order-events:
      name: ${KAFKA_ORDER_EVENTS_TOPIC:ymall.order.events.v1}
      partitions: ${KAFKA_ORDER_EVENTS_PARTITIONS:3}
      replication-factor: ${KAFKA_ORDER_EVENTS_REPLICATION_FACTOR:1}
      retention: ${KAFKA_ORDER_EVENTS_RETENTION:7d}
    outbox:
      enabled: ${KAFKA_OUTBOX_ENABLED:true}
      batch-size: ${KAFKA_OUTBOX_BATCH_SIZE:100}
      max-attempts: ${KAFKA_OUTBOX_MAX_ATTEMPTS:10}
      retry-delay: ${KAFKA_OUTBOX_RETRY_DELAY:5s}
      send-timeout: ${KAFKA_OUTBOX_SEND_TIMEOUT:10s}
      poll-interval: ${KAFKA_OUTBOX_POLL_INTERVAL:1s}
      cleanup-interval: ${KAFKA_OUTBOX_CLEANUP_INTERVAL:1h}
      published-retention: ${KAFKA_OUTBOX_PUBLISHED_RETENTION:7d}
    notification-consumer:
      enabled: ${KAFKA_NOTIFICATION_CONSUMER_ENABLED:true}
      group-id: ${KAFKA_NOTIFICATION_CONSUMER_GROUP:ymall-notification}
    review-summary:
      name: ${KAFKA_REVIEW_SUMMARY_TOPIC:ymall.review-summary.refresh.v1}
      partitions: ${KAFKA_REVIEW_SUMMARY_PARTITIONS:3}
      replication-factor: ${KAFKA_REVIEW_SUMMARY_REPLICATION_FACTOR:1}
      retention: ${KAFKA_REVIEW_SUMMARY_RETENTION:7d}
      group-id: ${KAFKA_REVIEW_SUMMARY_GROUP:ymall-review-summary}
    consumer-retry:
      max-retries: ${KAFKA_CONSUMER_MAX_RETRIES:3}
      retry-delay: ${KAFKA_CONSUMER_RETRY_DELAY:1s}
      dlt-retention: ${KAFKA_DLT_RETENTION:30d}
