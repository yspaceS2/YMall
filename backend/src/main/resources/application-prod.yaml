spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

ymall:
  oauth2:
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI}
    google-one-tap:
      client-id: ${spring.security.oauth2.client.registration.google.client-id}
      nonce-ttl: ${GOOGLE_ONE_TAP_NONCE_TTL:5m}
  email-change:
    code-ttl: ${EMAIL_CHANGE_CODE_TTL:5m}
    reauthentication-ttl: ${EMAIL_CHANGE_REAUTHENTICATION_TTL:10m}
    max-attempts: ${EMAIL_CHANGE_MAX_ATTEMPTS:5}
    max-requests: ${EMAIL_CHANGE_MAX_REQUESTS:5}
    request-window: ${EMAIL_CHANGE_REQUEST_WINDOW:30m}
    resend-interval: ${EMAIL_CHANGE_RESEND_INTERVAL:1m}
  signup-email-verification:
    code-ttl: ${SIGNUP_EMAIL_VERIFICATION_CODE_TTL:5m}
    token-ttl: ${SIGNUP_EMAIL_VERIFICATION_TOKEN_TTL:10m}
    max-attempts: ${SIGNUP_EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
    max-requests: ${SIGNUP_EMAIL_VERIFICATION_MAX_REQUESTS:5}
    request-window: ${SIGNUP_EMAIL_VERIFICATION_REQUEST_WINDOW:30m}
    resend-interval: ${SIGNUP_EMAIL_VERIFICATION_RESEND_INTERVAL:1m}
  mail:
    from: ${MAIL_FROM}
  password-reset:
    code-ttl: ${PASSWORD_RESET_CODE_TTL:5m}
    reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:10m}
    resend-interval: ${PASSWORD_RESET_RESEND_INTERVAL:1m}
    request-window: ${PASSWORD_RESET_REQUEST_WINDOW:1h}
    max-requests: ${PASSWORD_RESET_MAX_REQUESTS:5}
    max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
