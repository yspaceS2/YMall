server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ymall
    username: ymall_user
    password: your_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ymall-local}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ymall.backend.global.messaging
        spring.json.value.default.type: com.ymall.backend.global.messaging.OrderEventEnvelope

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

ymall:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 30m
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}
    refresh-token-cookie-secure: ${JWT_REFRESH_TOKEN_COOKIE_SECURE:false}
  oauth2:
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth2/callback}
  mail:
    from: ${MAIL_FROM}
  cache:
    product-detail-ttl: ${PRODUCT_DETAIL_CACHE_TTL:10m}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    order-events:
      name: ${KAFKA_ORDER_EVENTS_TOPIC:ymall.order.events.v1}
      partitions: ${KAFKA_ORDER_EVENTS_PARTITIONS:3}
      replication-factor: ${KAFKA_ORDER_EVENTS_REPLICATION_FACTOR:1}
      retention: ${KAFKA_ORDER_EVENTS_RETENTION:7d}
    outbox:
      enabled: ${KAFKA_OUTBOX_ENABLED:true}
      batch-size: ${KAFKA_OUTBOX_BATCH_SIZE:100}
      max-attempts: ${KAFKA_OUTBOX_MAX_ATTEMPTS:10}
      retry-delay: ${KAFKA_OUTBOX_RETRY_DELAY:5s}
      send-timeout: ${KAFKA_OUTBOX_SEND_TIMEOUT:10s}
      poll-interval: ${KAFKA_OUTBOX_POLL_INTERVAL:1s}
      cleanup-interval: ${KAFKA_OUTBOX_CLEANUP_INTERVAL:1h}
      published-retention: ${KAFKA_OUTBOX_PUBLISHED_RETENTION:7d}
    notification-consumer:
      enabled: ${KAFKA_NOTIFICATION_CONSUMER_ENABLED:true}
      group-id: ${KAFKA_NOTIFICATION_CONSUMER_GROUP:ymall-notification}
    consumer-retry:
      max-retries: ${KAFKA_CONSUMER_MAX_RETRIES:3}
      retry-delay: ${KAFKA_CONSUMER_RETRY_DELAY:1s}
      dlt-retention: ${KAFKA_DLT_RETENTION:30d}
