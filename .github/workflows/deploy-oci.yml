name: Deploy to OCI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oci-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v6

      - name: Notify Slack that deployment started
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          payload=$(jq -n \
            --arg text ":rocket: *YMall 운영 배포 시작*\n브랜치: ${GITHUB_REF_NAME} · 커밋: ${short_sha} · 실행자: ${GITHUB_ACTOR}\n<${RUN_URL}|GitHub Actions에서 보기>" \
            '{text: $text}')
          curl --fail --silent --show-error --retry 3 \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"

      - name: Configure SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key
          printf '%s\n' "$OCI_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/oci_deploy_key "$OCI_USER@$OCI_HOST" \
            "cd '$OCI_DEPLOY_PATH' && bash -s" < deploy/oci/deploy.sh

      - name: Notify Slack of deployment result
        if: ${{ always() }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOYMENT_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          if [[ "$DEPLOYMENT_STATUS" == "success" ]]; then
            title=":white_check_mark: *YMall 운영 배포 성공*"
          else
            title=":x: *YMall 운영 배포 실패*"
          fi
          payload=$(jq -n \
            --arg text "${title}\n브랜치: ${GITHUB_REF_NAME} · 커밋: ${short_sha} · 상태: ${DEPLOYMENT_STATUS}\n<${RUN_URL}|배포 로그 확인>" \
            '{text: $text}')
          curl --fail --silent --show-error --retry 3 \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
